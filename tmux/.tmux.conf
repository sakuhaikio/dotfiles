# ============================================================
# General
# ============================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g mouse off
set -g history-limit 50000
set -g automatic-rename off
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Prefix: Ctrl+B
set -g prefix C-b
bind C-b send-prefix


# ============================================================
# Status bar
# ============================================================

set -g status-style 'bg=#1e1e1e,fg=#aaaaaa'
set -g window-status-style 'fg=#777777'
set -g window-status-current-style 'fg=#61afef,bold'

set -g status-left ' #S '
set -g status-right ''

# Show window names without indices
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '

set -g pane-border-style 'fg=#2D2D2D'
set -g pane-active-border-style 'fg=#569CD6'

set -g mode-style 'bg=#264F78,fg=#9CDCFE'

set -g window-status-activity-style 'bg=#252526,fg=#D7BA7D'
set -g window-status-bell-style 'bg=#F44747,fg=#1F1F1F'


# ============================================================
# Windows and sessions
# ============================================================

# New window next to the current one, using the same directory
bind c new-window -a -c "#{pane_current_path}"

# Fuzzy window selection: Prefix + W
bind w display-popup -E -w 100% -h 35% -y 100% \
    "tmux list-windows -F '#{window_index}: #{window_name}' | \
     fzf --layout=default --border=none --info=inline | \
     cut -d: -f1 | \
     xargs -r tmux select-window -t"

# Fuzzy session selection: Prefix + F
bind f display-popup -E -w 100% -h 35% -y 100% \
    "tmux list-sessions -F '#{session_name}' | \
     fzf --layout=default --border=none --info=inline | \
     xargs -r tmux switch-client -t"

# Direct window selection: Alt+1..9 (ignore missing windows)
bind -n M-1 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 1' 'select-window -t :1'
bind -n M-2 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 2' 'select-window -t :2'
bind -n M-3 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 3' 'select-window -t :3'
bind -n M-4 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 4' 'select-window -t :4'
bind -n M-5 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 5' 'select-window -t :5'
bind -n M-6 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 6' 'select-window -t :6'
bind -n M-7 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 7' 'select-window -t :7'
bind -n M-8 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 8' 'select-window -t :8'
bind -n M-9 if-shell 'tmux list-windows -F "##{window_index}" | grep -qx 9' 'select-window -t :9'


# ============================================================
# Panes
# ============================================================

# Split panes in the current directory: Prefix + V/S
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Toggle pane zoom: Alt+Z
bind -n M-z resize-pane -Z

# Navigate panes without wrapping: Alt+H/J/K/L
bind -n M-h if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind -n M-j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -n M-k if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind -n M-l if-shell -F '#{pane_at_right}'  '' 'select-pane -R'


# ============================================================
# Copy mode
# ============================================================

# Toggle copy mode: Prefix + M
bind m if-shell -F '#{pane_in_mode}' \
    'send-keys -X cancel' \
    'copy-mode'

# Visual selection: v / V / Ctrl+V
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v \
    send-keys -X begin-selection \; \
    send-keys -X rectangle-on

# Clear selection without exiting copy mode
bind -T copy-mode-vi C-c send-keys -X clear-selection

# Copy selection: Ctrl+Shift+C
bind -T copy-mode-vi C-S-c send-keys -X copy-selection-and-cancel

# Copy active selection or start a yank text object
bind -T copy-mode-vi y \
    if-shell -F '#{selection_present}' \
        'send-keys -X copy-selection-and-cancel' \
        'switch-client -T textobj-yank'

# Exit copy mode
bind -T copy-mode-vi Escape send-keys -X cancel


# ============================================================
# Text objects
# ============================================================

# Text object prefixes: i / a / yi / ya
bind -T copy-mode-vi i switch-client -T textobj-inner
bind -T copy-mode-vi a switch-client -T textobj-around

bind -T textobj-yank i switch-client -T textobj-yank-inner
bind -T textobj-yank a switch-client -T textobj-yank-around

# Inner word: viw / viW
bind -T textobj-inner w \
    send-keys -X select-word \; \
    switch-client -T copy-mode-vi

bind -T textobj-inner W \
    set-option -g word-separators '' \; \
    send-keys -X select-word \; \
    set-option -gu word-separators \; \
    switch-client -T copy-mode-vi

# Yank inner word: yiw / yiW
bind -T textobj-yank-inner w \
    send-keys -X select-word \; \
    send-keys -X copy-selection-and-cancel

bind -T textobj-yank-inner W \
    set-option -g word-separators '' \; \
    send-keys -X select-word \; \
    set-option -gu word-separators \; \
    send-keys -X copy-selection-and-cancel

# Cancel text object operation: Ctrl+C
bind -T textobj-inner       C-c switch-client -T copy-mode-vi
bind -T textobj-around      C-c switch-client -T copy-mode-vi
bind -T textobj-yank        C-c switch-client -T copy-mode-vi
bind -T textobj-yank-inner  C-c switch-client -T copy-mode-vi
bind -T textobj-yank-around C-c switch-client -T copy-mode-vi
