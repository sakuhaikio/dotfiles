
# ============================================================
# Terminal and general settings
# ============================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -g automatic-rename off
setw -g mode-keys vi

# Prefix: Ctrl+B
set -g prefix C-b
bind C-b send-prefix


# ============================================================
# Status bar
# ============================================================

# Dark status bar
set -g status-style 'bg=#1e1e1e,fg=#aaaaaa'

# Active and inactive windows
set -g window-status-current-style 'fg=#61afef,bold'
set -g window-status-style 'fg=#777777'

# Status bar content
set -g status-left ' #S '
set -g status-right ' %H:%M '

# Window labels
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

# Optional theme
# source-file ~/.config/tmux/themes/vscode-dark.tmux.conf

# ============================================================
# Sessions and windows
# ============================================================

# Fuzzy window selection: Prefix + w
bind w display-popup -E -w 100% -h 35% -y 100% \
    "tmux list-windows -F '#{window_index}: #{window_name}' | \
     fzf --layout=default --border=none --info=inline | \
     cut -d: -f1 | \
     xargs -r tmux select-window -t"

# Fuzzy session selection: Prefix + f
bind f display-popup -E -w 100% -h 35% -y 100% \
    "tmux list-sessions -F '#{session_name}' | \
     fzf --layout=default --border=none --info=inline | \
     xargs -r tmux switch-client -t"

# Direct window selection: Alt+1 through Alt+9
bind -n M-1 select-window -t :0
bind -n M-2 select-window -t :1
bind -n M-3 select-window -t :2
bind -n M-4 select-window -t :3
bind -n M-5 select-window -t :4
bind -n M-6 select-window -t :5
bind -n M-7 select-window -t :6
bind -n M-8 select-window -t :7
bind -n M-9 select-window -t :8


# ============================================================
# Panes
# ============================================================

# Split panes: Prefix + v/s
bind v split-window -h
bind s split-window -v

# Toggle pane zoom: Alt+Z
bind -n M-z resize-pane -Z

# Navigate panes without wrapping: Alt+H/J/K/L
bind -n M-h if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind -n M-j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -n M-k if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind -n M-l if-shell -F '#{pane_at_right}'  '' 'select-pane -R'


# ============================================================
# Copy mode
# ============================================================

# Enter copy mode: Prefix + m
bind m copy-mode

# Vim-style visual selection
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v \
    send-keys -X begin-selection \; \
    send-keys -X rectangle-on

# Clear selection without leaving copy mode
bind -T copy-mode-vi C-c send-keys -X clear-selection

# Copy selection with Ctrl+Shift+C
bind -T copy-mode-vi C-S-c send-keys -X copy-selection-and-cancel

# Copy selection with y, or start a yank text object
bind -T copy-mode-vi y \
    if-shell -F '#{selection_present}' \
        'send-keys -X copy-selection-and-cancel' \
        'switch-client -T textobj-yank'


# ============================================================
# Text object prefixes
# ============================================================

# Inner and around text objects: i/a
bind -T copy-mode-vi i switch-client -T textobj-inner
bind -T copy-mode-vi a switch-client -T textobj-around

# Yank text objects: yi/ya
bind -T textobj-yank i switch-client -T textobj-yank-inner
bind -T textobj-yank a switch-client -T textobj-yank-around


# ============================================================
# Word text objects
# ============================================================

# Inner word: viw / viW
bind -T textobj-inner w \
    send-keys -X previous-word \; \
    send-keys -X begin-selection \; \
    send-keys -X next-word-end \; \
    switch-client -T copy-mode-vi

bind -T textobj-inner W \
    send-keys -X previous-space \; \
    send-keys -X begin-selection \; \
    send-keys -X next-space-end \; \
    switch-client -T copy-mode-vi

# Around word: vaw / vaW
bind -T textobj-around w \
    send-keys -X previous-word \; \
    send-keys -X begin-selection \; \
    send-keys -X next-word-end \; \
    send-keys -X next-word \; \
    switch-client -T copy-mode-vi

bind -T textobj-around W \
    send-keys -X previous-space \; \
    send-keys -X begin-selection \; \
    send-keys -X next-space-end \; \
    send-keys -X next-space \; \
    switch-client -T copy-mode-vi

# Yank inner word: yiw / yiW
bind -T textobj-yank-inner w \
    send-keys -X previous-word \; \
    send-keys -X begin-selection \; \
    send-keys -X next-word-end \; \
    send-keys -X copy-selection-and-cancel

bind -T textobj-yank-inner W \
    send-keys -X previous-space \; \
    send-keys -X begin-selection \; \
    send-keys -X next-space-end \; \
    send-keys -X copy-selection-and-cancel

# Yank around word: yaw / yaW
bind -T textobj-yank-around w \
    send-keys -X previous-word \; \
    send-keys -X begin-selection \; \
    send-keys -X next-word-end \; \
    send-keys -X next-word \; \
    send-keys -X copy-selection-and-cancel

bind -T textobj-yank-around W \
    send-keys -X previous-space \; \
    send-keys -X begin-selection \; \
    send-keys -X next-space-end \; \
    send-keys -X next-space \; \
    send-keys -X copy-selection-and-cancel


# ============================================================
# Text object cancellation
# ============================================================

# Escape returns to the normal copy-mode key table
bind -T textobj-inner       Escape switch-client -T copy-mode-vi
bind -T textobj-around      Escape switch-client -T copy-mode-vi
bind -T textobj-yank        Escape switch-client -T copy-mode-vi
bind -T textobj-yank-inner  Escape switch-client -T copy-mode-vi
bind -T textobj-yank-around Escape switch-client -T copy-mode-vi

